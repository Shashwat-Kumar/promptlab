[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "promptlab"
version = "0.1.0"
description = "Open, model-agnostic prompt optimization: run, score, diagnose, rewrite, repeat."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Shashwat Kumar"}]
[project.scripts]
promptlab = "promptlab.cli:main"
[tool.setuptools]
packages = ["promptlab"]
